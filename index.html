<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>d4-build2filter</title>
<style>
  :root { color-scheme: light dark; }
  body { font:16px/1.6 system-ui,sans-serif; max-width:46rem; margin:2rem auto; padding:0 1rem; }
  h1 { font-size:1.5rem; }
  input,select,button { font:inherit; padding:.5rem; }
  #url { width:100%; box-sizing:border-box; }
  #code { width:100%; height:8rem; font-family:ui-monospace,monospace; font-size:12px; }
  .row { display:flex; gap:1rem; flex-wrap:wrap; align-items:center; margin:1rem 0; }
  .warn { background:#fff4d6; color:#3a2c00; border-left:4px solid #e0a800; padding:.75rem; margin:1rem 0; }
  .err  { background:#ffe9e9; color:#4a0000; border-left:4px solid #c00; padding:.75rem; margin:1rem 0; }
  footer { margin-top:3rem; font-size:.9rem; opacity:.75 }
</style>
<body>
<h1>Билд с d4builds → лут-фильтр Diablo 4</h1>

<p><label for="url">Ссылка на билд</label>
<input id="url" placeholder="https://d4builds.gg/builds/…"></p>

<div class="row">
  <span>Прятать:
    <select id="tier">
      <option value="light" selected>мягко</option>
      <option value="medium">средне</option>
      <option value="strict">строго</option>
    </select>
  </span>
  <span>Порог совпадения:
    <select id="threshold">
      <option selected>1</option><option>2</option><option>3</option><option>4</option>
    </select>
  </span>
  <button id="go">Собрать фильтр</button>
</div>

<div id="msg"></div>

<div id="result" hidden>
  <h2 id="buildName"></h2>
  <p><button id="copy">Скопировать код</button> <span id="copied"></span></p>
  <textarea id="code" readonly></textarea>
  <div id="notes"></div>
</div>

<footer>
  Данные билда берутся с <a href="https://d4builds.gg">d4builds.gg</a> и принадлежат их авторам.<br>
  <a href="./selftest.html">Самопроверка</a> · <a href="./verify.html">Сверка id</a>
</footer>

<script type="module">
import { run } from './src/app.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));

$('go').onclick = async () => {
  $('msg').innerHTML = 'собираю…';
  $('result').hidden = true;
  $('copied').textContent = '';
  try {
    const r = await run($('url').value, {
      tier: $('tier').value,
      threshold: Number($('threshold').value),
    });
    $('msg').innerHTML = '';
    $('buildName').textContent = `${r.profile.name} — правил: ${r.filter.rules.length}`;
    $('code').value = r.code;

    const notes = [];
    if (r.untranslated.affixes.length) {
      notes.push(`<div class="warn"><b>Не перенесено в фильтр (${r.untranslated.affixes.length}):</b><br>
        ${r.untranslated.affixes.map(esc).join('<br>')}<br><br>
        Этих свойств ещё нет в таблице id — их добавляют экспортом из игры
        на <a href="./verify.html">странице сверки</a>. Остальное в фильтр попало.</div>`);
    }
    if (r.untranslated.types.length) {
      notes.push(`<div class="warn"><b>Типы вещей не подтверждены:</b> ${r.untranslated.types.map(esc).join(', ')}.
        Подсветка по ним работает без ограничения по типу — подсветится лишнее,
        но ничего нужного не потеряется.</div>`);
    }
    const temper = [...new Set(r.profile.slots.flatMap(s => s.tempering))];
    if (temper.length) {
      notes.push(`<div class="warn"><b>Закалка в фильтр не переносится</b> — это не свойство падающей вещи,
        её наносят у Кузнеца:<br>${temper.map(esc).join('<br>')}</div>`);
    }
    $('notes').innerHTML = notes.join('');
    $('result').hidden = false;
  } catch (e) {
    $('msg').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
};

$('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText($('code').value);
    $('copied').textContent = 'скопировано';
  } catch {
    $('code').select();
    $('copied').textContent = 'выделено — нажмите Ctrl+C';
  }
};
</script>
</body>
</html>
